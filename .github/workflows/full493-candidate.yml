name: Publish Full493 test candidate
on:
  push:
    branches: [feat/full493-waterfall]
    paths:
      - expansion/**
      - .github/workflows/full493-candidate.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify applicator update and patch workflows
        env:
          PYTHONPATH: expansion:mod-source
        run: python3 expansion/test_delta_update.py
      - name: Package source-dependent delta candidate
        run: python3 expansion/package_release.py --output /tmp/full493-release
      - name: Confirm feed matches reproducible core
        run: cmp expansion/update-test.json /tmp/full493-release/update.json
      - name: Publish test release without changing stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v0.11.0-full493-test.6
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" /tmp/full493-release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" /tmp/full493-release/* --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$GITHUB_SHA" --title 'PBR Full493 — Waterfall, shinies e chefes (teste Windows)' --notes-file expansion/RELEASE-NOTES.md
          fi
